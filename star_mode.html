<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六禧ETF轮动 · 星辰模式</title>
<!-- Tailwind CSS v3 (Play CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ============================================================
   星辰模式 · 全局视觉规范
   背景深空渐变 #080c1a → #101830；磨砂玻璃卡片；克制动画
   ============================================================ */
:root{
  --bg0:#080c1a; --bg1:#101830;
  --main:#4cd0f7;          /* 主星高亮 */
  --aux1:#b89dff; --aux2:#e6edff;  /* 辅星光 */
  --weak:#444a66;          /* 弱势星体 */
  --up:#72d893; --down:#f27886;    /* 上涨/下跌 */
  --ink:#e6edff; --mut:#8b95b8;   /* 主文字/次文字 */
  --line:rgba(184,157,255,.14);
  --glass:rgba(20,26,48,.55);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter','PingFang SC','Microsoft YaHei',-apple-system,sans-serif;
  background:linear-gradient(160deg,var(--bg0) 0%,var(--bg1) 55%,#0c1226 100%);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
/* ---- 微弱静态星空点阵背景（纯 CSS，不引入图片） ---- */
.stars-bg{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    radial-gradient(1px 1px at 8% 12%, rgba(230,237,255,.7), transparent 40%),
    radial-gradient(1px 1px at 22% 34%, rgba(184,157,255,.5), transparent 40%),
    radial-gradient(1.5px 1.5px at 38% 8%, rgba(230,237,255,.55), transparent 40%),
    radial-gradient(1px 1px at 55% 22%, rgba(76,208,247,.6), transparent 40%),
    radial-gradient(1.5px 1.5px at 68% 12%, rgba(230,237,255,.5), transparent 40%),
    radial-gradient(1px 1px at 82% 30%, rgba(184,157,255,.5), transparent 40%),
    radial-gradient(1.5px 1.5px at 92% 8%, rgba(230,237,255,.6), transparent 40%),
    radial-gradient(1px 1px at 12% 70%, rgba(76,208,247,.45), transparent 40%),
    radial-gradient(1px 1px at 30% 84%, rgba(230,237,255,.5), transparent 40%),
    radial-gradient(1.5px 1.5px at 48% 92%, rgba(184,157,255,.45), transparent 40%),
    radial-gradient(1px 1px at 64% 78%, rgba(230,237,255,.5), transparent 40%),
    radial-gradient(1.5px 1.5px at 78% 90%, rgba(76,208,247,.4), transparent 40%),
    radial-gradient(1px 1px at 90% 66%, rgba(230,237,255,.5), transparent 40%);
  background-size:640px 640px;
}
main{position:relative; z-index:1;}

/* ---- 磨砂玻璃卡片 ---- */
.glass{
  background:var(--glass);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);
  border-radius:18px;
}
.section-title{
  display:flex; align-items:center; gap:10px;
  font-size:16px; font-weight:700; color:var(--ink); letter-spacing:.02em;
}
.section-title::before{content:''; width:4px; height:16px; border-radius:2px; background:var(--main); box-shadow:0 0 10px var(--main);}

/* ---- 导航 ---- */
.nav-link{color:var(--mut); text-decoration:none; font-size:14px; transition:color .15s;}
.nav-link:hover{color:var(--ink);}
.brand-glow{text-shadow:0 0 18px rgba(76,208,247,.55);}

/* ---- 表格 ---- */
.data-table{width:100%; border-collapse:collapse; font-size:13px;}
.data-table th{
  background:rgba(184,157,255,.06); color:var(--mut); font-weight:600;
  padding:11px 10px; border-bottom:1px solid var(--line); white-space:nowrap; text-align:center;
}
.data-table td{
  padding:11px 10px; white-space:nowrap; text-align:center; border-bottom:1px solid rgba(184,157,255,.07);
  color:var(--ink); font-variant-numeric:tabular-nums;
}
.data-table tbody tr:hover td{background:rgba(76,208,247,.05);}
.up{color:var(--up);} .down{color:var(--down);} .mut{color:var(--mut);}
.pill{display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600;}
.pill.ok{background:rgba(114,216,147,.14); color:var(--up);}
.pill.bad{background:rgba(242,120,134,.14); color:var(--down);}
.pill.hold{background:rgba(76,208,247,.14); color:var(--main);}

/* ---- 六星图动画（克制） ---- */
@keyframes breathe{
  0%,100%{opacity:.55; transform:scale(1);}
  50%{opacity:1; transform:scale(1.28);}
}
@keyframes railFlow{
  to{stroke-dashoffset:-24;}
}
.star-glow{transform-origin:center; transform-box:fill-box;}
.star-glow.pulse{animation:breathe 2.4s ease-in-out infinite;}
.rail-flow{animation:railFlow 1.1s linear infinite;}

/* ---- 悬浮卡片 ---- */
.star-tip{
  position:absolute; z-index:30; pointer-events:none; display:none;
  min-width:180px; padding:12px 14px; border-radius:12px;
  background:rgba(14,20,40,.92); backdrop-filter:blur(10px);
  border:1px solid var(--line); box-shadow:0 8px 30px rgba(0,0,0,.5);
}
.star-tip.show{display:block;}
.star-tip .t-name{font-size:14px; font-weight:700; color:var(--ink);}
.star-tip .t-row{font-size:12px; color:var(--mut); display:flex; justify-content:space-between; margin-top:4px;}
.star-tip .t-row b{color:var(--ink); font-variant-numeric:tabular-nums;}

/* ---- 净值曲线 ---- */
.chart-wrap{width:100%;}
.chart-wrap svg{width:100%; height:auto; display:block;}

/* ---- 响应式 ---- */
@media (max-width:720px){
  .hex-box{height:340px !important;}
  .data-table{font-size:11px;}
  .data-table th,.data-table td{padding:8px 5px;}
}
</style>
</head>
<body>
<div class="stars-bg"></div>
<main class="max-w-6xl mx-auto px-4 md:px-6 pb-16">

  <!-- ============ 1. 顶部导航栏 ============ -->
  <nav class="flex items-center justify-between py-5">
    <div class="flex items-center gap-3">
      <span class="text-lg font-extrabold brand-glow" style="color:var(--main)">✦ 六禧ETF轮动</span>
      <span class="text-xs mut hidden md:inline">六星寻禧，择耀而动</span>
    </div>
    <div class="flex items-center gap-5">
      <a class="nav-link" href="#constellation">星图</a>
      <a class="nav-link" href="#strategy">策略说明</a>
      <a class="nav-link" href="#history">历史记录</a>
      <a class="nav-link" href="#nav">回测净值</a>
    </div>
  </nav>

  <!-- ============ 2. 首屏：六边形六星星座图 ============ -->
  <section id="constellation" class="glass p-5 md:p-6 mb-6">
    <div class="flex items-center justify-between mb-2">
      <div class="section-title">六曜星池 · 六星寻禧</div>
      <span class="text-xs mut">悬浮星体查看详情 · 点击星体切换主星演示</span>
    </div>
    <div id="hexBox" class="hex-box relative" style="height:520px">
      <svg id="hexSvg" width="100%" height="100%" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="starTip" class="star-tip"></div>
    </div>
  </section>

  <!-- ============ 3. 策略当前状态 ============ -->
  <section id="strategy" class="glass p-6 mb-6">
    <div class="section-title mb-4">策略当前状态</div>
    <div id="stateCard" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    <p id="stateLine" class="text-sm mt-4" style="color:var(--mut)"></p>
  </section>

  <!-- ============ 4. ETF 动量排名表 ============ -->
  <section class="glass p-6 mb-6">
    <div class="section-title mb-4">ETF 动量排名</div>
    <div class="overflow-x-auto">
      <table class="data-table">
        <thead><tr>
          <th>排名</th><th>名称</th><th>代码</th><th>最新价</th><th>涨跌幅</th><th>动量得分</th>
          <th>MA50</th><th>均线状态</th><th>RSRS-Z</th><th>昨日成交金额</th><th>ATR比率</th><th>今日最高</th><th>今日最低</th>
        </tr></thead>
        <tbody id="rankBody"></tbody>
      </table>
    </div>
  </section>

  <!-- ============ 5. 净值曲线 ============ -->
  <section id="nav" class="glass p-6 mb-6">
    <div class="flex items-center justify-between mb-4">
      <div class="section-title">回测净值曲线</div>
      <span id="navNote" class="text-xs mut"></span>
    </div>
    <div class="chart-wrap"><svg id="navChart" viewBox="0 0 900 320" preserveAspectRatio="none"></svg></div>
  </section>

  <!-- ============ 6. 最近交易记录 + 收益归因 ============ -->
  <section id="history" class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
    <div class="glass p-6">
      <div class="section-title mb-4">最近交易记录</div>
      <div class="overflow-x-auto">
        <table class="data-table">
          <thead><tr><th>日期</th><th>动作</th><th>标的</th><th>价格</th><th>本笔收益</th><th>策略净值</th></tr></thead>
          <tbody id="tradeBody"></tbody>
        </table>
      </div>
    </div>
    <div class="glass p-6">
      <div class="section-title mb-4">收益归因</div>
      <div class="chart-wrap"><svg id="attrChart" viewBox="0 0 420 320"></svg></div>
    </div>
  </section>

  <!-- ============ 7. 策略规则说明 ============ -->
  <section class="glass p-6 mb-6">
    <div class="section-title mb-4">策略规则说明</div>
    <div id="rulesBox" class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5 text-sm leading-relaxed"></div>
    <div class="text-xs mt-5" style="color:var(--mut)">⚠️ 以上为真实回测口径（通达信数据 2020-01~2026-08），实盘成本可能更高。QDII 存在溢价与节假日错位。</div>
  </section>

</main>

<script>
/* ================================================================
   数据接口层 —— 后续接入真实数据时，仅需替换 dataProvider() 的返回
   每个星体/标的一行字段：
   code 代码, name 名称, momentum 动量得分(×10000的斜率), latest 最新价,
   chgPct 涨跌幅%, ma50 MA50值, maOk 是否站上MA50, rsrsZ RSRS-Z,
   yAmt 昨日成交金额(元), atrRatio ATR比率(小数，如0.88), high 今日最高,
   low 今日最低, holding 是否当前持仓主星
   ================================================================ */
function dataProvider(){
  // ---- 模拟测试数据（演示六星图动态效果；后续回填真实数据） ----
  const stars = [
    {code:'513030', name:'德国DAX', momentum: 51.2, latest:1.940, chgPct:-0.56, ma50:1.902, maOk:true,  rsrsZ: 0.82, yAmt:1.85e8, atrRatio:0.88, high:1.958, low:1.925, holding:true },
    {code:'513520', name:'日经225', momentum: 31.8, latest:2.372, chgPct:+1.24, ma50:2.310, maOk:true,  rsrsZ: 0.35, yAmt:6.20e7, atrRatio:0.72, high:2.380, low:2.340, holding:false},
    {code:'518880', name:'黄金',   momentum: 40.3, latest:8.946, chgPct:-1.06, ma50:8.810, maOk:true,  rsrsZ: 0.60, yAmt:3.10e8, atrRatio:0.55, high:9.020, low:8.900, holding:false},
    {code:'159941', name:'纳指',   momentum: 35.5, latest:1.699, chgPct:+2.16, ma50:1.660, maOk:true,  rsrsZ: 0.45, yAmt:2.40e8, atrRatio:0.90, high:1.710, low:1.680, holding:false},
    {code:'159915', name:'创板100', momentum: -2.3, latest:3.645, chgPct:+1.14, ma50:3.700, maOk:false, rsrsZ:-0.20, yAmt:4.50e8, atrRatio:1.10, high:3.660, low:3.610, holding:false},
    {code:'159985', name:'豆粕',   momentum:-18.7, latest:2.139, chgPct:+0.61, ma50:2.180, maOk:false, rsrsZ:-0.55, yAmt:3.50e7, atrRatio:1.25, high:2.150, low:2.120, holding:false},
  ];
  // 策略当前状态（模拟）
  const state = {
    holding:'德国DAX', code:'513030', entryPx:1.895, peak:2.010, posW:0.87, coeff:0.88,
    retreat:3.48, stopPrice:1.889, nextRebal:'2026-08-21（周五）14:45-14:55',
  };
  // 净值曲线（模拟 navSeries）
  const nav = {
    dates:['07-20','07-21','07-22','07-23','07-24','07-27','07-28','07-29','07-30','07-31','08-03','08-04','08-05','08-06','08-07','08-10','08-11','08-12','08-13','08-14'],
    values:[4.78,4.81,4.90,4.86,4.95,4.92,5.01,5.08,5.12,5.06,5.15,5.20,5.28,5.35,5.30,5.42,5.38,5.45,5.50,5.44],
    totalPct:+411.7, annual:29.4, sharpe:1.66, mdd:15.4, trades:186,
  };
  // 交易记录（模拟，最近几笔）
  const trades = [
    {date:'2026-08-14', act:'仓位再平衡', sym:'德国DAX', px:1.940, ret:null, nav:5.441},
    {date:'2026-08-07', act:'买入',     sym:'德国DAX', px:1.895, ret:null, nav:5.300},
    {date:'2026-07-28', act:'止盈卖出', sym:'豆粕',   px:2.183, ret:+2.81, nav:5.284},
    {date:'2026-07-24', act:'仓位再平衡', sym:'豆粕',   px:2.290, ret:null, nav:5.140},
    {date:'2026-07-17', act:'买入',     sym:'豆粕',   px:2.271, ret:null, nav:5.104},
    {date:'2026-07-09', act:'换仓',     sym:'日经225', px:2.350, ret:+1.62, nav:5.080},
  ];
  // 收益归因（每笔持仓贡献，单位 pp，模拟）
  const attr = [
    {label:'德国DAX（持仓中）', val:+2.37, open:true},
    {label:'豆粕 07-17 → 07-28', val:+2.81},
    {label:'日经225 06-23 → 07-09', val:+1.62},
    {label:'黄金 06-12 → 06-23', val:-0.94},
    {label:'纳指 05-08 → 06-04', val:+1.10},
  ];
  return {stars, state, nav, trades, attr};
}

/* ============ 工具 ============ */
function fmtPct(x,dg=2){ return (x>=0?'+':'')+(x*100).toFixed(dg)+'%'; }
function fmtVol(v){ if(v==null||!isFinite(v)) return '—'; if(v>=1e8) return (v/1e8).toFixed(2)+'亿'; if(v>=1e4) return (v/1e4).toFixed(1)+'万'; return String(Math.round(v)); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* ============ 渲染：六星图 ============ */
const CX=400, CY=400, R=280;                       // 正六边形中心与半径
const ORDER=['德国DAX','日经225','黄金','纳指','创板100','豆粕']; // 顶点顺序（顺时针，自顶部）
let curHoldingCode=null;                            // 当前主星（来自数据 holding）
let hoverCode=null;                                 // 悬浮星体
let railAnim=null;                                  // 光轨动画句柄

function buildHex(){
  const svg=document.getElementById('hexSvg');
  const D=dataProvider();
  curHoldingCode=D.stars.find(s=>s.holding)?.code || null;
  // 按 ORDER 排布顶点坐标
  const pts=ORDER.map((nm,i)=>{
    const ang=(-90 + i*60) * Math.PI/180;
    return {name:nm, x:CX+R*Math.cos(ang), y:CY+R*Math.sin(ang)};
  });
  // 绑定数据
  pts.forEach(p=>{ p.star=D.stars.find(s=>s.name===p.name); });
  // 动量归一化（用于半径/亮度）
  const moms=pts.map(p=>p.star.momentum);
  const mn=Math.min.apply(null,moms), mx=Math.max.apply(null,moms);
  const norm=m=> (mx-mn)===0 ? 0.5 : clamp((m-mn)/(mx-mn),0,1);

  let defs=`
    <defs>
      <radialGradient id="gMain" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#4cd0f7" stop-opacity="1"/>
        <stop offset="100%" stop-color="#4cd0f7" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="gAux" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#b89dff" stop-opacity="1"/>
        <stop offset="100%" stop-color="#b89dff" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="gRail" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#4cd0f7" stop-opacity="0"/>
        <stop offset="100%" stop-color="#4cd0f7" stop-opacity=".9"/>
      </linearGradient>
    </defs>`;

  // 淡虚线星轨轮廓：六边形
  const hexPts=pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  let contour=`<polygon points="${hexPts}" fill="none" stroke="rgba(184,157,255,.22)" stroke-width="1.2" stroke-dasharray="5 7"/>`;
  // 顶点之间辅助虚线（六边形边 + 中心到顶点淡线）
  pts.forEach(p=>{ contour+=`<line x1="${CX}" y1="${CY}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="rgba(184,157,255,.08)" stroke-width="1" stroke-dasharray="2 6"/>`; });

  // 星体 + 光晕
  let starsSvg='';
  pts.forEach((p,i)=>{
    const s=p.star, n=norm(s.momentum);
    const isMain=(s.code===curHoldingCode);
    const isWeak=(s.momentum<=0);
    // 半径：6 ~ 14（动量越大越大）；亮度：0.35 ~ 1
    const r=6+n*8;
    const glowR=r*3.2;
    const color=isMain? '#4cd0f7' : (isWeak? '#444a66' : (n>0.5?'#b89dff':'#e6edff'));
    const glowColor=isMain? 'url(#gMain)' : (isWeak? 'rgba(68,74,102,.4)' : 'url(#gAux)');
    const baseOp=isWeak? 0.4 : (0.45+n*0.55);
    starsSvg+=`
      <circle class="star-glow ${isMain?'pulse':''}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${glowR}" fill="${glowColor}" opacity="${isWeak?0.35:(isMain?0.9:baseOp)}"/>
      <circle class="star-body" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}" fill="${color}" stroke="rgba(230,237,255,.85)" stroke-width="1.4" opacity="${isWeak?0.75:1}" data-code="${s.code}" data-name="${s.name}"/>`;
  });

  // 中心标题 + slogan
  const center=`
    <text x="${CX}" y="${CY-10}" text-anchor="middle" font-size="34" font-weight="800" fill="#e6edff" style="text-shadow:0 0 20px rgba(76,208,247,.6)">六禧ETF轮动</text>
    <text x="${CX}" y="${CY+22}" text-anchor="middle" font-size="16" fill="#8b95b8" letter-spacing="6">六星寻禧 · 择耀而动</text>`;

  // 光轨（中心 → 主星），初始指向主星
  const rail=`<line id="rail" x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY}" stroke="url(#gRail)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 10" class="rail-flow"/>`;

  svg.innerHTML=defs+contour+starsSvg+rail+center;

  // 事件绑定
  svg.querySelectorAll('.star-body').forEach(el=>{
    el.addEventListener('mouseenter',e=>onStarHover(e,el.dataset.code,true));
    el.addEventListener('mousemove',e=>moveTip(e));
    el.addEventListener('mouseleave',()=>onStarHover(null,null,false));
    el.addEventListener('click',e=>{ setMainStar(el.dataset.code); });
  });
  updateRail(curHoldingCode);
}

/* 悬浮卡片 */
function onStarHover(e,code,show){
  hoverCode=show?code:null;
  const tip=document.getElementById('starTip');
  if(!show){ tip.classList.remove('show'); updateRail(curHoldingCode); return; }
  const D=dataProvider(); const s=D.stars.find(x=>x.code===code); if(!s) return;
  tip.innerHTML=`
    <div class="t-name">${s.name} ${s.code===curHoldingCode?'· 主星':''}</div>
    <div class="t-row"><span>动量得分</span><b>${s.momentum>0?'+':''}${s.momentum.toFixed(1)}</b></div>
    <div class="t-row"><span>最新价</span><b>${s.latest.toFixed(3)}</b></div>
    <div class="t-row"><span>涨跌幅</span><b style="color:${s.chgPct>=0?'var(--up)':'var(--down)'}">${fmtPct(s.chgPct/100)}</b></div>
    <div class="t-row"><span>MA50状态</span><b style="color:${s.maOk?'var(--up)':'var(--down)'}">${s.maOk?'站上MA50':'低于MA50'}</b></div>`;
  tip.classList.add('show');
  moveTip(e);
  updateRail(code);
}
function moveTip(e){
  const tip=document.getElementById('starTip');
  const box=document.getElementById('hexBox').getBoundingClientRect();
  tip.style.left=(e.clientX-box.left+14)+'px';
  tip.style.top=(e.clientY-box.top+14)+'px';
}
/* 点击切换主星（演示光轨平滑切换） */
function setMainStar(code){
  if(code===curHoldingCode) return;
  curHoldingCode=code;
  buildHex();          // 重建星体高亮
  updateRail(code);
}
/* 光轨平滑切换：rAF 插值终点 */
function updateRail(toCode){
  const D=dataProvider(); const s=D.stars.find(x=>x.code===toCode);
  const p=ORDER.findIndex(n=>n===s.name);
  const ang=(-90+p*60)*Math.PI/180;
  const tx=CX+R*Math.cos(ang), ty=CY+R*Math.sin(ang);
  const rail=document.getElementById('rail'); if(!rail) return;
  const sx=+rail.getAttribute('x2'), sy=+rail.getAttribute('y2');
  if(railAnim) cancelAnimationFrame(railAnim);
  const t0=performance.now(), dur=550;
  function step(t){
    const k=clamp((t-t0)/dur,0,1);
    const e=1-Math.pow(1-k,3); // easeOutCubic
    rail.setAttribute('x2',(sx+(tx-sx)*e).toFixed(1));
    rail.setAttribute('y2',(sy+(ty-sy)*e).toFixed(1));
    if(k<1) railAnim=requestAnimationFrame(step);
  }
  railAnim=requestAnimationFrame(step);
}

/* ============ 渲染：净值曲线 ============ */
function renderNav(){
  const D=dataProvider(); const nav=D.nav;
  const svg=document.getElementById('navChart');
  const W=900,H=320,P=40;
  const vals=nav.values, n=vals.length;
  const min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  const rng=(max-min)||1;
  const X=i=>P+(W-2*P)*i/(n-1);
  const Y=v=>H-P-(H-2*P)*(v-min)/rng;
  const pts=vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const area=pts+' '+(W-P)+','+(H-P)+' '+P+','+(H-P);
  const gid='navG'+Date.now();
  // 网格 + 星轨渐变曲线 + 填充
  let grid='';
  for(let g=0;g<=4;g++){ const y=Y(min+rng*g/4); grid+=`<line x1="${P}" y1="${y}" x2="${W-P}" y2="${y}" stroke="rgba(184,157,255,.08)" stroke-width="1"/>`; }
  for(let i=0;i<n;i+=Math.ceil(n/8)){ const x=X(i); grid+=`<line x1="${x}" y1="${P}" x2="${x}" y2="${H-P}" stroke="rgba(184,157,255,.06)" stroke-width="1"/>`; }
  const labels=nav.dates.filter((d,i)=>i%Math.ceil(n/8)===0).map((d,i)=>`<text x="${X(i*Math.ceil(n/8))}" y="${H-P+18}" text-anchor="middle" font-size="11" fill="#8b95b8">${d}</text>`).join('');
  svg.innerHTML=`
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b89dff"/><stop offset="50%" stop-color="#4cd0f7"/><stop offset="100%" stop-color="#72d893"/>
    </linearGradient>
    <linearGradient id="${gid}a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4cd0f7" stop-opacity=".22"/><stop offset="100%" stop-color="#4cd0f7" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <polygon points="${area}" fill="url(#${gid}a)"/>
    <polyline points="${pts}" fill="none" stroke="url(#${gid})" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${labels}`;
  document.getElementById('navNote').textContent=
    `2020 起 · 总收益 ${nav.totalPct>0?'+':''}${nav.totalPct}% · 年化 ${nav.annual}% · 夏普 ${nav.sharpe} · 最大回撤 ${nav.mdd}% · 交易 ${nav.trades} 笔`;
}

/* ============ 渲染：收益归因（横向条形） ============ */
function renderAttr(){
  const D=dataProvider(); const attr=D.attr;
  const svg=document.getElementById('attrChart');
  const W=420, rowH=46, top=20, left=130;
  const maxAbs=Math.max.apply(null,attr.map(a=>Math.abs(a.val)))||1;
  const barW=v=>Math.abs(v)/maxAbs*(W-left-30);
  let html='';
  attr.forEach((a,i)=>{
    const y=top+i*rowH;
    const w=barW(a.val);
    const x=a.val>=0?left:left-w;
    const col=a.val>=0?'#72d893':'#f27886';
    html+=`
      <text x="8" y="${y+8}" font-size="12" fill="#8b95b8">${a.label}</text>
      <text x="${W-8}" y="${y+8}" text-anchor="end" font-size="12" font-weight="700" fill="${col}">${a.val>=0?'+':''}${a.val.toFixed(2)}pp</text>
      <rect x="${x}" y="${y+14}" width="${w}" height="14" rx="4" fill="${col}" opacity="${a.open?0.55:0.8}" ${a.open?'stroke="#4cd0f7" stroke-dasharray="4 3" stroke-width="1.2"':''}/>`;
  });
  svg.innerHTML=html;
}
